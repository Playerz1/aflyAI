<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050609">
  <meta name="robots" content="noindex, nofollow">
  <title>Usuários · Prospecta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body data-page="usuarios" data-role="admin">

  <div class="app">
    <div data-shell-sidebar></div>
    <div data-shell-topbar></div>

    <div class="main">
      <div class="content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">Usuários</h1>
            <p class="page-head__sub">Gerencie contas, permissões e status dos usuários.</p>
          </div>
        </div>

        <section class="card mt-24">
          <div class="card__head">
            <div>
              <div class="card__title">Contas da plataforma</div>
              <div class="card__sub">Lista de todos os usuários cadastrados</div>
            </div>
          </div>
          <div class="card__body">
            <div class="table-wrap">
              <table class="table table--compact">
                <thead>
                  <tr>
                    <th>Usuário</th>
                    <th>E-mail</th>
                    <th>Função</th>
                    <th>Plano</th>
                    <th>Status</th>
                    <th class="num">Último login</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="tabela-usuarios">
                  <!-- renderizado via JS -->
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    <div><strong data-toast-title>Feito!</strong><small data-toast-text></small></div>
  </div>

  <script src="assets/js/store.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script src="assets/js/app-shell.js?v=1"></script>
  <script>
    (function () {
      var D = window.Dados;
      var P = window.Prospecta;
      var corpo = document.getElementById("tabela-usuarios");

      D.pronto().then(function () {
        var me = D.eu ? D.eu() : null;
        if (!me || !D.ehAdmin()) { window.location.href = "login.html?destino=usuarios.html"; return; }
        P.initShell({ title: "Usuários", crumbs: "Administração <b>/</b> <b>Usuários</b>", isAdmin: true, user: me });
        P.iniciarAvatares(me);

        function render() {
          var usuarios = D.usuarios() || [];
          if (!usuarios.length) {
            corpo.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-mute)">Nenhum usuário cadastrado.</td></tr>';
            return;
          }
          corpo.innerHTML = usuarios.map(function (u) {
            var badge = u.role === "admin" ? "badge--primary" : "badge--neutral";
            var statusBadge = u.status === "ativo" ? "badge--primary" : u.status === "convite" ? "badge--neutral" : "badge--neutral";
            var label = u.status === "ativo" ? "Ativo" : u.status === "convite" ? "Convite" : "Bloqueado";
            var inicial = u.iniciais || P.iniciaisDoNome(u.nome);
            return '' +
            '<tr>' +
            '<td class="cell-user"><div class="avatar avatar--sm">' + inicial + '</div><div class="cell-user__name">' + esc(u.nome) + '</div><div class="cell-user__sub">' + esc(u.role) + '</div></td>' +
            '<td><div class="cell-main">' + esc(u.email) + '</div></td>' +
            '<td><span class="badge ' + badge + '">' + (u.role === "admin" ? "Admin" : "Usuário") + '</span></td>' +
            '<td>' + esc(u.plano || "—") + '</td>' +
            '<td><span class="badge ' + statusBadge + '">' + label + '</span></td>' +
            '<td class="num">' + (u.ultimoLogin ? esc(u.ultimoLogin) : "—") + '</td>' +
            '<td class="t-actions">' +
            '<button class="btn btn--outline btn--sm">Editar</button>' +
            '</td>' +
            '</tr>';
          }).join("");
        }

        render();
        document.addEventListener("prospecta:mudou", render);
      });
    })();

    function esc(str) { return String(str || "").replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  </script>
</body>
</html>
