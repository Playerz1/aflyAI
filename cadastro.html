<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12142b">
  <meta name="robots" content="noindex, nofollow">
  <title>Criar conta · Prospecta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2312142b'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .auth { min-height:100dvh; display:grid; place-items:center; padding:24px 16px; background: radial-gradient(900px 500px at 10% -10%, #eef0ff 0%, transparent 60%), radial-gradient(700px 400px at 110% 110%, #e6f6fe 0%, transparent 55%), var(--bg); }
    .auth__card { width:100%; max-width:440px; }
    .auth__brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px; }
    .auth__brand .brand__logo { width:42px; height:42px; border-radius:12px; font-size:18px; }
    .auth__brand strong { display:block; font-size:15px; letter-spacing:-.02em; }
    .auth__brand span { display:block; font-size:11.5px; color:var(--text-mute); }
    .auth__card .card { padding:26px; }
  </style>
</head>
<body data-page="cadastro">
  <div class="auth">
    <div class="auth__card">
      <div class="auth__brand">
        <span class="brand__logo" style="background:linear-gradient(135deg,#12142b,#4f46e5)">P</span>
        <div>
          <strong>Prospecta</strong>
          <span>Crie sua conta</span>
        </div>
      </div>

      <form class="card" id="form-cadastro" novalidate>
        <div class="row" style="margin-bottom:16px">
          <span class="kpi__icon kpi__icon--primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
          </span>
          <div>
            <div class="card__title" style="font-size:15px">Criar conta</div>
            <div class="card__sub">Cadastro seguro (senha com hash no servidor)</div>
          </div>
        </div>

        <div class="field">
          <label class="label" for="cad-nome">Nome</label>
          <input class="input" id="cad-nome" type="text" autocomplete="name" placeholder="Seu nome" required>
        </div>
        <div class="field">
          <label class="label" for="cad-email">E-mail</label>
          <input class="input" id="cad-email" type="email" autocomplete="email" placeholder="voce@empresa.com" required>
        </div>
        <div class="field">
          <label class="label" for="cad-senha">Senha</label>
          <input class="input" id="cad-senha" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required>
        </div>

        <div class="mt-16" id="cad-erro" style="display:none">
          <div class="banner banner--danger" style="padding:10px 12px">
            <span class="banner__icon" style="width:30px;height:30px;border-radius:9px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
            </span>
            <div><div class="banner__title" id="cad-erro-txt">Falha ao cadastrar</div></div>
          </div>
        </div>

        <button class="btn btn--primary btn--block btn--lg mt-24" type="submit" id="btn-cad">Criar conta</button>
        <div class="divider"></div>
        <div class="t-13 muted" style="text-align:center">Já tem conta? <a class="link" href="login.html">Entrar</a></div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    <div><strong data-toast-title>Feito!</strong><small data-toast-text></small></div>
  </div>

  <script src="assets/js/store.js?v=c32d255-scroll"></script>
  <script src="assets/js/app.js?v=c32d255-scroll"></script>
  <script>
    (function () {
      var D = window.Dados;
      D.pronto().then(function(){ var me=D.eu&&D.eu(); if(me){ location.replace(me.papel==='admin'?'admin.html':'dashboard.html'); }});

      var form = document.getElementById('form-cadastro');
      var erro = document.getElementById('cad-erro');
      var erroTxt = document.getElementById('cad-erro-txt');
      var btn = document.getElementById('btn-cad');

      form.addEventListener('submit', async function(e){
        e.preventDefault(); erro.style.display='none';
        var name = document.getElementById('cad-nome').value.trim();
        var email = document.getElementById('cad-email').value.trim();
        var password = document.getElementById('cad-senha').value;
        if (name.length < 2) { erroTxt.textContent='Informe seu nome.'; erro.style.display=''; return; }
        if (!email) { erroTxt.textContent='Informe seu e-mail.'; erro.style.display=''; return; }
        if (password.length < 6) { erroTxt.textContent='A senha deve ter ao menos 6 caracteres.'; erro.style.display=''; return; }
        btn.disabled = true;
        try {
          var res = await fetch('/api/auth/signup', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name:name, email:email, password:password }) });
          var data = null; try { data = await res.json(); } catch(_){}
          if (!res.ok) throw new Error((data && data.error) || 'Falha ao cadastrar');
          if (D.refresh) await D.refresh();
          var me = D.eu ? D.eu() : (data && data.user ? { papel: data.user.role==='admin'?'admin':'membro' } : null);
          location.replace(me && me.papel==='admin' ? 'admin.html' : 'dashboard.html');
        } catch (err) {
          erroTxt.textContent = (err && err.message) ? err.message : 'Falha ao cadastrar.';
          erro.style.display=''; btn.disabled=false;
        }
      });
    })();
  </script>
</body>
</html>
