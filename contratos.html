<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050609">
  <meta name="robots" content="noindex, nofollow">
  <title>Contratos · Prospecta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body data-page="contratos">

  <div class="app">
    <div data-shell-sidebar></div>
    <div data-shell-topbar></div>

    <div class="main">
      <div class="content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">Contratos</h1>
            <p class="page-head__sub">Contratos ativos, fechados e vencidos.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn--primary">Novo contrato</button>
          </div>
        </div>

        <section class="card mt-24">
          <div class="card__head">
            <div>
              <div class="card__title">Meus contratos</div>
              <div class="card__sub">Acompanhe status e valores dos seus contratos</div>
            </div>
          </div>
          <div class="card__body">
            <div class="empty" style="padding:56px 24px">
              <div class="empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="12" rx="2" ry="2"/><path d="M7 7v4a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7z"/></svg></div>
              <div class="empty__title">Nenhum contrato</div>
              <div class="empty__text">Seus contratos aparecerão aqui após a contratação de um plano.</div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    <div><strong data-toast-title>Feito!</strong><small data-toast-text></small></div>
  </div>

  <script src="assets/js/store.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script src="assets/js/app-shell.js?v=1"></script>
  <script>
    (function () {
      var D = window.Dados;
      var P = window.Prospecta;
      D.pronto().then(function () {
        var me = D.eu ? D.eu() : null;
        if (!me) { window.location.href = "login.html?destino=contratos.html"; return; }
        P.initShell({ title: "Contratos", crumbs: "Conta <b>/</b> <b>Contratos</b>", isAdmin: false, user: me });
        P.iniciarAvatares(me);
      });
    })();
  </script>
</body>
</html>
