<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050609">
  <meta name="robots" content="noindex, nofollow">
  <title>Recuperar senha · Prospecta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .auth-page { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
    .auth-card { width: 100%; max-width: 410px; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow-lg); padding: 34px 28px; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); }
    .auth-card__logo { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-weight: 800; font-size: 18px; margin: 0 auto 22px; box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4); }
    .auth-card__title { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; color: #fff; letter-spacing: -.02em; }
    .auth-card__sub { font-size: 14px; color: var(--text-mute); text-align: center; margin-bottom: 28px; }
    .auth-form { display: flex; flex-direction: column; gap: 18px; }
    .step { display: none; }
    .step.is-active { display: block; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field + .field { margin-top: 0; }
    .label { font-size: 12.5px; font-weight: 650; color: var(--text-soft); display: flex; align-items: center; gap: 7px; }
    .input, .select, .textarea { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); color: #fff; font-family: inherit; font-size: 15px; transition: border var(--transition), box-shadow var(--transition); outline: none; }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18); }
    .input::placeholder { color: var(--text-mute); }
    .btn--primary { height: 50px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin-top: 6px; }
    .btn--block { width: 100%; }
    .btn--outline { height: 44px; font-size: 14px; }
    #rec-erro { display: none; margin-top: 12px; }
    .banner--danger { background: rgba(59, 130, 246, 0.12); border: 1px solid var(--border-strong); }
    .banner__icon--danger { background: var(--primary); color: #fff; }
    #rec-sucesso { display: none; margin-top: 12px; text-align: center; padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
    #rec-sucesso .sucesso__title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    #rec-sucesso .sucesso__text { font-size: 13px; color: var(--text-soft); margin-bottom: 12px; }
    .link-row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    .link-row a { font-size: 13px; color: var(--text-mute); text-decoration: none; }
    .link-row a:hover { color: #fff; text-decoration: underline; }
  </style>
</head>
<body data-page="recuperar">

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__logo">P</div>
      <div class="auth-card__title">Recuperar senha</div>
      <div class="auth-card__sub">Redefinição de acesso à sua conta</div>

      <form class="auth-form" id="form-recuperar" novalidate>

        <!-- Passo 1: solicitar link -->
        <div class="step is-active" id="step-solicitar">
          <div class="field">
            <label class="label" for="rec-email">E-mail cadastrado</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input class="input" id="rec-email" type="email" autocomplete="email" placeholder="voce@empresa.com" required>
            </div>
          </div>

          <button class="btn btn--primary btn--block btn--lg" type="button" id="btn-rec-solicitar">
            Enviar link de recuperação
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7"/></svg>
          </button>

          <div id="rec-erro">
            <div class="banner banner--danger">
              <span class="banner__icon banner__icon--danger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              </span>
              <div>
                <div class="banner__title" id="rec-erro-txt">Falha ao processar</div>
                <div class="banner__text" style="font-size:12.5px;margin-top:4px" id="rec-erro-desc"></div>
              </div>
            </div>
          </div>

          <div class="link-row" style="margin-top:14px">
            <a class="link" href="login.html">Lembra a senha? Entrar</a>
          </div>
        </div>

        <!-- Passo 2: redefinir senha -->
        <div class="step" id="step-redefinir">
          <div class="field">
            <label class="label" for="rec-token">Token de recuperação</label>
            <input class="input" id="rec-token" type="text" placeholder="Cole o token recebido por e-mail" required>
          </div>
          <div class="field">
            <label class="label" for="rec-nova">Nova senha</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="input" id="rec-nova" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>
          </div>
          <div class="field">
            <label class="label" for="rec-conf">Confirmar nova senha</label>
            <input class="input" id="rec-conf" type="password" autocomplete="new-password" placeholder="Repita a nova senha" required minlength="8">
          </div>

          <button class="btn btn--primary btn--block btn--lg" type="button" id="btn-rec-redefinir">
            Redefinir senha
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7"/></svg>
          </button>

          <div id="rec-erro2">
            <div class="banner banner--danger">
              <span class="banner__icon banner__icon--danger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              </span>
              <div>
                <div class="banner__title" id="rec-erro-txt2">Falha ao redefinir</div>
                <div class="banner__text" style="font-size:12.5px;margin-top:4px" id="rec-erro-desc2"></div>
              </div>
            </div>
          </div>

          <div class="link-row" style="margin-top:14px">
            <a class="link" href="login.html">Voltar para o login</a>
          </div>
        </div>
      </form>

      <div id="rec-sucesso">
        <div class="sucesso__title">Senha redefinida com sucesso!</div>
        <div class="sucesso__text">Você pode entrar com a nova senha.</div>
        <a class="btn btn--outline btn--block btn--sm mt-12" href="login.html">Ir para o login</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    <div><strong data-toast-title>Feito!</strong><small data-toast-text></small></div>
  </div>

  <script src="assets/js/store.js?v=1"></script>
  <script>
    (function () {
      var D = window.Dados;
      var form = document.getElementById("form-recuperar");
      var stepSolicitar = document.getElementById("step-solicitar");
      var stepRedefinir = document.getElementById("step-redefinir");
      var sucesso = document.getElementById("rec-sucesso");
      var btnSolicitar = document.getElementById("btn-rec-solicitar");
      var btnRedefinir = document.getElementById("btn-rec-redefinir");

      function mostrarErro(elTxt, elDesc, elBox, txt, desc) {
        elTxt.textContent = txt;
        if (elDesc) elDesc.textContent = desc || "";
        elBox.style.display = "";
      }
      function esconderErro(elBox) { elBox.style.display = "none"; }

      // Detecta token na URL
      var params = new URLSearchParams(location.search);
      var tokenUrl = params.get("token");
      if (tokenUrl) {
        stepSolicitar.classList.remove("is-active");
        stepRedefinir.classList.add("is-active");
        document.getElementById("rec-token").value = tokenUrl;
      }

      btnSolicitar.addEventListener("click", function () {
        var email = document.getElementById("rec-email").value.trim();
        var box = document.getElementById("rec-erro");
        var txt = document.getElementById("rec-erro-txt");
        var desc = document.getElementById("rec-erro-desc");
        esconderErro(box);
        if (!email) { mostrarErro(txt, desc, box, "Informe seu e-mail."); return; }
        btnSolicitar.disabled = true;
        D.solicitarRecuperacaoSenha(email).then(function () {
          btnSolicitar.disabled = false;
          stepSolicitar.classList.remove("is-active");
          sucesso.style.display = "";
        }).catch(function (err) {
          btnSolicitar.disabled = false;
          mostrarErro(txt, desc, box, (err && err.message) || "Falha ao processar.", "Tente novamente.");
        });
      });

      btnRedefinir.addEventListener("click", function () {
        var token = document.getElementById("rec-token").value.trim();
        var nova = document.getElementById("rec-nova").value;
        var conf = document.getElementById("rec-conf").value;
        var box = document.getElementById("rec-erro2");
        var txt = document.getElementById("rec-erro-txt2");
        var desc = document.getElementById("rec-erro-desc2");
        esconderErro(box);
        if (!token) { mostrarErro(txt, desc, box, "Token inválido ou expirado. Solicite um novo link."); return; }
        if (nova !== conf) { mostrarErro(txt, desc, box, "As senhas não conferem."); return; }
        if (!nova || nova.length < 8) { mostrarErro(txt, desc, box, "A senha deve ter ao menos 8 caracteres."); return; }
        btnRedefinir.disabled = true;
        D.redefinirSenha(token, nova).then(function () {
          btnRedefinir.disabled = false;
          stepRedefinir.classList.remove("is-active");
          sucesso.style.display = "";
        }).catch(function (err) {
          btnRedefinir.disabled = false;
          mostrarErro(txt, desc, box, (err && err.message) || "Token inválido ou expirado.", "Solicite um novo link de recuperação.");
        });
      });
    })();
  </script>
</body>
</html>
