<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050609">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar · Prospecta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .auth-page { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
    .auth-card { width: 100%; max-width: 410px; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow-lg); padding: 34px 28px; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); }
    .auth-card__logo { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-weight: 800; font-size: 18px; margin: 0 auto 22px; box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4); }
    .auth-card__title { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; color: #fff; letter-spacing: -.02em; }
    .auth-card__sub { font-size: 14px; color: var(--text-mute); text-align: center; margin-bottom: 28px; }
    .auth-form { display: flex; flex-direction: column; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field + .field { margin-top: 0; }
    .label { font-size: 12.5px; font-weight: 650; color: var(--text-soft); display: flex; align-items: center; gap: 7px; }
    .input-wrap { position: relative; }
    .input-wrap > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-mute); pointer-events: none; }
    .input-wrap__action { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--text-mute); padding: 4px; border-radius: 6px; cursor: pointer; }
    .input-wrap__action:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .input, .select, .textarea { width: 100%; height: 46px; padding: 0 14px 0 44px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); color: #fff; font-family: inherit; font-size: 15px; transition: border var(--transition), box-shadow var(--transition); outline: none; }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18); }
    .input::placeholder { color: var(--text-mute); }
    .btn--primary { height: 50px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin-top: 6px; }
    .btn--block { width: 100%; }
    .auth-footer { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; font-size: 13px; color: var(--text-soft); }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .link-row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    .link-row a { font-size: 13px; color: var(--text-mute); text-decoration: none; }
    .link-row a:hover { color: #fff; text-decoration: underline; }
    #login-erro { display: none; margin-top: 12px; }
    .banner--danger { background: rgba(59, 130, 246, 0.12); border: 1px solid var(--border-strong); }
    .banner__icon--danger { background: var(--primary); color: #fff; }
  </style>
</head>
<body data-page="login">

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__logo">P</div>
      <div class="auth-card__title">Entrar</div>
      <div class="auth-card__sub">Acesso à sua conta Prospecta</div>

      <form class="auth-form" id="form-login" novalidate>
        <div class="field">
          <label class="label" for="login-email">E-mail</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input class="input" id="login-email" type="email" autocomplete="username" placeholder="voce@empresa.com" required>
          </div>
        </div>

        <div class="field">
          <label class="label" for="login-senha">Senha</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" id="login-senha" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="4">
            <button type="button" class="input-wrap__action" id="login-ver" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button class="btn btn--primary btn--block btn--lg" type="submit" id="btn-login">
          Entrar
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </button>

        <div class="link-row">
          <a class="link" href="recuperar.html">Esqueci a senha</a>
          <a class="link" href="cadastro.html">Criar conta</a>
        </div>
      </form>

      <div id="login-erro">
        <div class="banner banner--danger">
          <span class="banner__icon banner__icon--danger">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </span>
          <div>
            <div class="banner__title" id="login-erro-txt">Falha ao entrar</div>
            <div class="banner__text" style="font-size:12.5px;margin-top:4px" id="login-erro-desc"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    <div><strong data-toast-title>Feito!</strong><small data-toast-text></small></div>
  </div>

  <script src="assets/js/store.js?v=1"></script>
  <script>
    (function () {
      var D = window.Dados;
      var form = document.getElementById("form-login");
      var btn = document.getElementById("btn-login");
      var erro = document.getElementById("login-erro");
      var erroTxt = document.getElementById("login-erro-txt");
      var erroDesc = document.getElementById("login-erro-desc");

      var ver = document.getElementById("login-ver");
      var senha = document.getElementById("login-senha");
      var mostrando = false;
      ver.addEventListener("click", function () {
        mostrando = !mostrando;
        senha.type = mostrando ? "text" : "password";
        ver.innerHTML = mostrando ?
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06 5.94M18.58 1.58A18.45 18.45 0 0 1 23 8a10 10 0 0 1-5.06 5.94"/><line x1="1" y1="1" x2="3" y2="3"/></svg>' :
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
      });

      function mostrarErro(txt, desc) {
        erroTxt.textContent = txt;
        if (desc) erroDesc.textContent = desc; else erroDesc.textContent = "";
        erro.style.display = "";
      }
      function esconderErro() { erro.style.display = "none"; }

      btn.addEventListener("click", function (e) { e.preventDefault(); entrar(); });
      form.addEventListener("submit", function (e) { e.preventDefault(); entrar(); });

      async function entrar() {
        esconderErro();
        var email = document.getElementById("login-email").value.trim();
        var senha = document.getElementById("login-senha").value;
        if (!email) { mostrarErro("Informe seu e-mail."); return; }
        if (!senha || senha.length < 4) { mostrarErro("Informe sua senha (mínimo 4 caracteres)."); return; }
        btn.disabled = true;
        try {
          var usuario = await D.login(email, senha);
          window.location.href = "dashboard.html";
        } catch (err) {
          btn.disabled = false;
          mostrarErro((err && err.message) || "Falha ao entrar", "Verifique seu e-mail e senha e tente novamente.");
        }
      }
    })();
  </script>
</body>
</html>
