<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050609">
  <meta name="robots" content="noindex, nofollow">
  <title>Equipes · Prospecta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .modal-equipe { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s; }
    .modal-equipe.is-open { opacity: 1; visibility: visible; }
    .modal-equipe__panel { width: 100%; max-width: 560px; max-height: calc(100dvh - 48px); overflow-y: auto; background: var(--surface); border: 1px solid var(--border-glass); border-radius: 22px; box-shadow: var(--shadow-lg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); transform: translateY(14px) scale(0.98); transition: transform 0.25s; }
    .modal-equipe.is-open .modal-equipe__panel { transform: none; }
    .modal-equipe__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 24px 26px 0; }
    .modal-equipe__title { font-size: 17px; font-weight: 700; color: #fff; }
    .modal-equipe__body { padding: 20px 26px 26px; }
    .modal-equipe__foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 26px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 22px 22px; }
    .equipe-card { display: flex; align-items: center; gap: 16px; padding: 18px 22px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface-2); transition: all 0.2s; }
    .equipe-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
    .equipe-avatar { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; background: linear-gradient(135deg, var(--primary-dark), var(--primary-intense)); color: #fff; font-weight: 700; font-size: 16px; overflow: hidden; }
    .equipe-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .equipe-info { min-width: 0; flex: 1; }
    .equipe-nome { font-size: 15px; font-weight: 700; color: #fff; }
    .equipe-meta { font-size: 12.5px; color: var(--text-mute); margin-top: 3px; }
    .equipe-acoes { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
    .empty-equipe { padding: 56px 24px; text-align: center; }
    .empty-equipe__icon { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 16px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-mute); }
    .empty-equipe__icon svg { width: 28px; height: 28px; }
    .empty-equipe__title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .empty-equipe__text { font-size: 14px; color: var(--text-mute); max-width: 360px; margin: 6px auto 16px; }
    .form-equipe { display: grid; gap: 16px; }
    .form-equipe .field + .field { margin-top: 0; }
    .label { font-size: 12.5px; font-weight: 650; color: var(--text-soft); display: flex; align-items: center; gap: 7px; }
    .input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); color: #fff; font-family: inherit; font-size: 15px; transition: border 0.2s, box-shadow 0.2s; outline: none; }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18); }
    .input::placeholder { color: var(--text-mute); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent; background: var(--surface); color: #fff; font-weight: 600; font-size: 14.5px; white-space: nowrap; transition: all 0.2s; cursor: pointer; }
    .btn svg { width: 16px; height: 16px; stroke-width: 2; }
    .btn:active { transform: translateY(1px); }
    .btn--primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35), inset 0 1px 0 rgba(255,255,255,0.15); }
    .btn--primary:hover { box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); filter: brightness(1.05); }
    .btn--outline { background: var(--surface); border-color: var(--border-strong); color: var(--text-soft); }
    .btn--outline:hover { background: var(--surface-2); color: #fff; border-color: rgba(59, 130, 246, 0.6); }
    .btn--block { width: 100%; }
    .btn--ghost { background: transparent; box-shadow: none; color: var(--text-soft); }
    .btn--ghost:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .toast { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; gap: 12px; align-items: flex-start; min-width: 280px; max-width: min(400px, calc(100vw - 40px)); padding: 16px 20px; border-radius: 12px; background: #020305; color: #fff; font-size: 13.5px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); transform: translateY(24px); opacity: 0; visibility: hidden; transition: all 0.25s ease; }
    .toast.is-open { transform: none; opacity: 1; visibility: visible; }
    .toast__icon { width: 20px; height: 20px; color: var(--primary); flex-shrink: 0; margin-top: 1px; }
  </style>
</head>
<body data-page="equipes">

  <div class="app">
    <div data-shell-sidebar></div>
    <div data-shell-topbar></div>

    <div class="main">
      <div class="content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">Equipes</h1>
            <p class="page-head__sub">Gerencie membros, convites e permissões da sua conta.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn--primary" id="btn-nova-equipe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              Nova equipe
            </button>
          </div>
        </div>

        <section class="card mt-24">
          <div class="card__head">
            <div>
              <div class="card__title">Minhas equipes</div>
              <div class="card__sub">Lista de equipes às quais você pertence</div>
            </div>
          </div>
          <div class="card__body">
            <div id="lista-equipes"></div>
          </div>
        </section>

        <section class="card mt-24">
          <div class="card__head">
            <div>
              <div class="card__title">Membros da equipe</div>
              <div class="card__sub">Integrantes e seus níveis de acesso</div>
            </div>
          </div>
          <div class="card__body">
            <div id="lista-membros"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- Modal nova equipe -->
  <div class="modal-equipe" id="modal-equipe">
    <div class="modal-equipe__panel">
      <div class="modal-equipe__head">
        <div>
          <div class="modal-equipe__title">Nova equipe</div>
        </div>
        <button class="icon-btn" id="fechar-equipe" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-equipe__body">
        <form class="form-equipe" id="form-equipe" novalidate>
          <div class="field">
            <label class="label" for="eq-nome">Nome da equipe</label>
            <input class="input" id="eq-nome" type="text" placeholder="Ex.: Equipe Comercial" required>
          </div>
          <div class="field">
            <label class="label" for="eq-desc">Descrição</label>
            <input class="input" id="eq-desc" type="text" placeholder="O que esta equipe faz?">
          </div>
        </form>
      </div>
      <div class="modal-equipe__foot">
        <button class="btn btn--ghost" id="cancelar-equipe">Cancelar</button>
        <button class="btn btn--primary btn--block" type="submit" form="form-equipe">Criar equipe</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    <div><strong data-toast-title>Feito!</strong><small data-toast-text></small></div>
  </div>

  <script src="assets/js/store.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script src="assets/js/app-shell.js?v=1"></script>
  <script>
    (function () {
      var D = window.Dados;
      var P = window.Prospecta;
      var listaEl = document.getElementById("lista-equipes");
      var membrosEl = document.getElementById("lista-membros");
      var modal = document.getElementById("modal-equipe");
      var btnNova = document.getElementById("btn-nova-equipe");
      var btnFechar = document.getElementById("fechar-equipe");
      var btnCancelar = document.getElementById("cancelar-equipe");
      var form = document.getElementById("form-equipe");

      function set(sel, value) { document.querySelectorAll(sel).forEach(function (el) { el.textContent = value; }); }

      D.pronto().then(function () {
        var me = D.eu ? D.eu() : null;
        if (!me) { window.location.href = "login.html?destino=equipes.html"; return; }
        P.initShell({ title: "Equipes", crumbs: "Conta <b>/</b> <b>Equipes</b>", isAdmin: false, user: me });
        P.iniciarAvatares(me);

        btnNova.addEventListener("click", function () { modal.classList.add("is-open"); });
        btnFechar.addEventListener("click", function () { modal.classList.remove("is-open"); });
        btnCancelar.addEventListener("click", function () { modal.classList.remove("is-open"); });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var nome = document.getElementById("eq-nome").value.trim();
          var desc = document.getElementById("eq-desc").value.trim();
          if (!nome) return;
          // Simulação local — em produção via API /api/equipes
          var equipes = JSON.parse(localStorage.getItem("prospecta:equipes") || "[]");
          equipes.push({ id: "eq_" + Date.now(), nome: nome, descricao: desc, dono: me.email, membros: [me.email], criado: new Date().toISOString() });
          localStorage.setItem("prospecta:equipes", JSON.stringify(equipes));
          modal.classList.remove("is-open");
          form.reset();
          P.toast("Equipe criada", "A equipe \"" + nome + "\" foi adicionada.");
          render();
        });

        function render() {
          var equipes = JSON.parse(localStorage.getItem("prospecta:equipes") || "[]");
          if (!equipes.length) {
            listaEl.innerHTML = '' +
              '<div class="empty-equipe">' +
              '<div class="empty-equipe__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M1 21h22l-3-6m-6-3l6-6m-6 3l6 6"/></svg></div>' +
              '<div class="empty-equipe__title">Nenhuma equipe ainda</div>' +
              '<div class="empty-equipe__text">Clique em “Nova equipe” para criar sua primeira equipe e convidar membros.</div>' +
              '</div>';
          } else {
            listaEl.innerHTML = equipes.map(function (eq) {
              var inicial = eq.nome ? eq.nome.split(/\s+/).map(function (p) { return p[0] || ""; }).join("").slice(0, 2).toUpperCase() : "?";
              return '' +
              '<div class="equipe-card">' +
              '<span class="equipe-avatar">' + inicial + '</span>' +
              '<div class="equipe-info">' +
              '<div class="equipe-nome">' + esc(eq.nome) + '</div>' +
              '<div class="equipe-meta">' + (eq.descricao || "Sem descrição") + " · " + eq.membros.length + " membro" + (eq.membros.length !== 1 ? "s" : "") + '</div>' +
              '</div>' +
              '<div class="equipe-acoes">' +
              '<button class="btn btn--outline btn--sm">Gerenciar</button>' +
              '</div>' +
              '</div>';
            }).join("");
          }

          // Membros (mock a partir do usuário logado)
          membrosEl.innerHTML = '' +
          '<div class="equipe-card">' +
          '<span class="equipe-avatar avatar-update">' + (me.iniciais || P.iniciaisDoNome(me.nome)) + '</span>' +
          '<div class="equipe-info">' +
          '<div class="equipe-nome nome-update">' + esc(me.nome || "Conta") + '</div>' +
          '<div class="equipe-meta email-update">' + esc(me.email || "—") + " · Você (dono)" + '</div>' +
          '</div>' +
          '<div class="equipe-acoes">' +
          '<button class="btn btn--ghost btn--sm">Editar</button>' +
          '</div>' +
          '</div>';
        }

        function esc(str) { return String(str || "").replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

        render();
        document.addEventListener("prospecta:mudou", render);
      });
    })();
  </script>
</body>
</html>
