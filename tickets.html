<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050609">
  <meta name="robots" content="noindex, nofollow">
  <title>Tickets · Prospecta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <style>
    .admin-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; align-items: stretch; height: calc(100dvh - var(--topbar-h) - 28px); }
    .admin-inbox { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
    .admin-inbox__head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: rgba(2,3,5,0.4); }
    .admin-inbox__head h3 { font-size: 15px; font-weight: 700; color: #fff; }
    .admin-inbox__search { width: 100%; max-width: 260px; }
    .admin-inbox__list { flex: 1; overflow-y: auto; min-height: 0; }
    .ticket-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit; }
    .ticket-row:last-child { border-bottom: none; }
    .ticket-row:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .ticket-row.is-selected { background: var(--primary-soft); border-left: 4px solid var(--primary); }
    .ticket-row__avatar { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0; background: linear-gradient(135deg, var(--primary-dark), var(--primary-intense)); color: #fff; font-weight: 700; font-size: 13px; overflow: hidden; }
    .ticket-row__avatar img { width: 100%; height: 100%; object-fit: cover; }
    .ticket-row__body { min-width: 0; flex: 1; }
    .ticket-row__title { font-size: 13.5px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .ticket-row__meta { font-size: 12px; color: var(--text-mute); line-height: 1.4; }
    .ticket-row__actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
    .admin-conv { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; min-height: 0; display: none; }
    .admin-conv.is-open { display: flex; }
    .admin-conv__head { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: rgba(2,3,5,0.4); }
    .admin-conv__back { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
    .admin-conv__back svg { width: 16px; height: 16px; stroke-width: 2; }
    .admin-conv__info { flex: 1; min-width: 0; }
    .admin-conv__name { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-conv__meta { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
    .admin-conv__actions { display: flex; gap: 8px; flex-shrink: 0; }
    .admin-conv__messages { flex: 1; overflow-y: auto; padding: 20px 22px; background: var(--surface-2); min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .admin-conv__composer { display: flex; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
    .admin-conv__composer .textarea { flex: 1; min-height: 44px; max-height: 120px; height: 44px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); color: #fff; font-family: inherit; font-size: 14px; resize: none; outline: none; transition: border 0.2s; }
    .admin-conv__composer .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18); }
    .admin-conv__send { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--primary); color: #fff; display: grid; place-items: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
    .admin-conv__send:hover { box-shadow: 0 4px 16px rgba(59, 130, 246, 0.45); filter: brightness(1.05); }
    .admin-conv__send svg { width: 18px; height: 18px; stroke-width: 2; }
    .admin-conv__send:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; box-shadow: var(--shadow-xs); word-break: break-word; white-space: pre-line; position: relative; }
    .msg__meta { display: block; font-size: 10.5px; margin-top: 4px; opacity: 0.75; text-align: right; }
    .msg--out { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35); }
    .msg--in { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
    .msg--system { align-self: center; max-width: 100%; background: transparent; box-shadow: none; color: var(--text-mute); font-size: 11.5px; text-align: center; padding: 4px 0; }
    .empty-tickets { padding: 56px 24px; text-align: center; }
    .empty-tickets__icon { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 16px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-mute); }
    .empty-tickets__icon svg { width: 28px; height: 28px; }
    .empty-tickets__title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .empty-tickets__text { font-size: 14px; color: var(--text-mute); max-width: 360; margin: 6px auto 16px; }
    .st { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
    .st::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .st--aberto { background: rgba(59, 130, 246, 0.16); color: var(--primary); }
    .st--respondido { background: rgba(59, 130, 246, 0.16); color: var(--primary); }
    .st--resolvido { background: rgba(59, 130, 246, 0.16); color: var(--primary); }
    .chat-typing { display: inline-flex; gap: 3px; align-items: center; padding: 10px 14px; }
    .chat-typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--text-mute); animation: blink 1.2s infinite; }
    .chat-typing i:nth-child(2) { animation-delay: 0.15s; }
    .chat-typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }
    .status-select { width: 140px; height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: #fff; font-size: 12.5px; outline: none; }
    .status-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18); }
    .live-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--primary); font-weight: 600; margin-left: 8px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 8px var(--primary); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .new-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--primary); color: #fff; margin-left: 6px; }
    @media (max-width: 1180px) { .admin-grid { grid-template-columns: 1fr; } .admin-inbox { max-height: 420px; } .admin-conv__back { display: grid; } }
    @media (max-width: 860px) { .admin-grid { grid-template-columns: 1fr; } .admin-inbox { max-height: none; } .admin-inbox__search { width: 100%; } }
  </style>
</head>
<body data-page="tickets" data-role="admin">

  <div class="app">
    <div data-shell-sidebar></div>
    <div data-shell-topbar></div>

    <div class="main">
      <div class="content">
        <div class="page-head">
          <div>
            <h1 class="page-head__title">Central de tickets</h1>
            <p class="page-head__sub">Atendimento em tempo real · conversas atualizadas automaticamente</p>
          </div>
        </div>

        <div class="admin-grid">
          <!-- Inbox (admin) / Meus tickets (usuario) -->
          <div class="admin-inbox" id="admin-inbox">
            <div class="admin-inbox__head">
              <div>
                <h3 id="inbox-titulo">Tickets</h3>
              </div>
              <input class="input" id="inbox-busca" type="search" placeholder="Buscar tickets…" style="height:34px;padding:0 12px;font-size:13px">
            </div>
            <div class="admin-inbox__list" id="lista-tickets">
              <!-- tickets renderizados aqui -->
            </div>
          </div>

          <!-- Conversa -->
          <div class="admin-conv" id="admin-conv">
            <div class="admin-conv__head">
              <button class="admin-conv__back" id="conv-back" aria-label="Voltar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <div class="admin-conv__info">
                <div class="admin-conv__name" id="conv-nome">Ticket</div>
                <div class="admin-conv__meta" id="conv-meta">—</div>
              </div>
              <div class="admin-conv__actions">
                <select class="status-select" id="conv-status">
                  <option value="aberto">Aberto</option>
                  <option value="respondido">Respondido</option>
                  <option value="resolvido">Resolvido</option>
                </select>
                <span class="live-indicator" id="conv-live"><span class="live-dot"></span>Ao vivo</span>
              </div>
            </div>
            <div class="admin-conv__messages" id="conv-mensagens"></div>
            <div class="admin-conv__composer">
              <textarea class="textarea" id="conv-input" rows="1" placeholder="Escreva uma resposta…" aria-label="Mensagem"></textarea>
              <button class="admin-conv__send" id="conv-enviar" aria-label="Enviar mensagem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="toast__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    <div><strong data-toast-title>Feito!</strong><small data-toast-text></small></div>
  </div>

  <script src="assets/js/store.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script src="assets/js/app-shell.js?v=1"></script>
  <script>
    (function () {
      var D = window.Dados;
      var P = window.Prospecta;

      var inboxEl = document.getElementById("admin-inbox");
      var listaEl = document.getElementById("lista-tickets");
      var convEl = document.getElementById("admin-conv");
      var convNome = document.getElementById("conv-nome");
      var convMeta = document.getElementById("conv-meta");
      var convMsg = document.getElementById("conv-mensagens");
      var convInput = document.getElementById("conv-input");
      var convEnviar = document.getElementById("conv-enviar");
      var convStatus = document.getElementById("conv-status");
      var convBack = document.getElementById("conv-back");
      var buscaEl = document.getElementById("inbox-busca");
      var inboxTitulo = document.getElementById("inbox-titulo");

      var estado = { ticketId: null, ehAdmin: false, me: null, pollTimer: null };

      function pararPolling() { if (estado.pollTimer) { clearInterval(estado.pollTimer); estado.pollTimer = null; } }
      function iniciarPolling() {
        pararPolling();
        if (!estado.ticketId) return;
        estado.pollTimer = setInterval(function () {
          carregarMensagens(estado.ticketId);
        }, 4000);
      }

      function set(sel, value) { document.querySelectorAll(sel).forEach(function (el) { el.textContent = value; }); }

      D.pronto().then(function () {
        var me = D.eu ? D.eu() : null;
        if (!me) { window.location.href = "login.html?destino=tickets.html"; return; }
        estado.ehAdmin = D.ehAdmin();
        estado.me = me;
        P.initShell({ title: "Central de tickets", crumbs: "Suporte <b>/</b> <b>Atendimentos</b>", isAdmin: estado.ehAdmin, user: me });
        P.iniciarAvatares(me);

        if (estado.ehAdmin) {
          inboxTitulo.textContent = "Todos os tickets";
          document.title = "Central de tickets · Prospecta";
        } else {
          inboxTitulo.textContent = "Meus atendimentos";
        }

        // Busca
        buscaEl.addEventListener("input", function () { renderLista(); });

        // Voltar
        convBack.addEventListener("click", function () { fecharConv(); });

        // Status
        convStatus.addEventListener("change", function () {
          if (!estado.ticketId) return;
          D.atualizarTicket(estado.ticketId, { status: convStatus.value }).then(function () {
            renderLista();
            P.toast("Status atualizado", "Ticket #" + estado.ticketId + " agora está " + convStatus.value);
          }).catch(function (err) { P.toast("Erro", (err && err.message) || "Falha ao atualizar status"); });
        });

        // Enviar mensagem
        function enviar() {
          var txt = convInput.value.trim();
          if (!txt || !estado.ticketId) return;
          convEnviar.disabled = true;
          D.enviarMensagem(estado.ticketId, txt, estado.ehAdmin ? "admin" : "cliente").then(function () {
            convInput.value = "";
            convInput.style.height = "44px";
            carregarMensagens(estado.ticketId);
            P.toast("Mensagem enviada", "A conversa foi atualizada.");
          }).catch(function (err) {
            convEnviar.disabled = false;
            P.toast("Erro", (err && err.message) || "Falha ao enviar");
          }).finally(function () { convEnviar.disabled = false; });
        }
        convEnviar.addEventListener("click", enviar);
        convInput.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); } });
        convInput.addEventListener("input", function () { convInput.style.height = "44px"; convInput.style.height = Math.min(120, convInput.scrollHeight) + "px"; });

        // Abrir ticket da lista
        document.addEventListener("click", function (e) {
          var row = e.target.closest(".ticket-row");
          if (row) {
            e.preventDefault();
            var id = row.getAttribute("data-ticket-id");
            abrirConv(id);
          }
        });

        renderLista();
        document.addEventListener("prospecta:mudou", function () { renderLista(); if (estado.ticketId) carregarMensagens(estado.ticketId); });
      });

      /* ---------- Lista de tickets ---------- */
      function renderLista() {
        var filtro = buscaEl.value.trim().toLowerCase();
        var tickets = D.tickets().filter(function (t) {
          if (!estado.ehAdmin) return String(t.cliente && t.cliente.email).toLowerCase() === String(estado.me && estado.me.email).toLowerCase();
          return true;
        }).filter(function (t) {
          if (!filtro) return true;
          var s = (t.assunto || "") + " " + (t.cliente && t.cliente.nome || "") + " " + (t.cliente && t.cliente.email || "");
          return s.toLowerCase().indexOf(filtro) >= 0;
        }).sort(function (a, b) { return new Date(b.atualizado || b.criado) - new Date(a.atualizado || a.criado); });

        if (!tickets.length) {
          listaEl.innerHTML = '' +
            '<div class="empty-tickets">' +
            '<div class="empty-tickets__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>' +
            '<div class="empty-tickets__title">Nenhum ticket</div>' +
            '<div class="empty-tickets__text">' + (estado.ehAdmin ? "Não há atendimentos no momento." : "Você não tem atendimentos abertos. Abra um novo ticket na página inicial.") + '</div>' +
            '</div>';
          return;
        }
        listaEl.innerHTML = tickets.map(function (t) {
          var inicial = t.cliente && t.cliente.iniciais ? t.cliente.iniciais : (t.cliente && t.cliente.nome ? t.cliente.nome.split(/\s+/).map(function (p) { return p[0] || ""; }).join("").slice(0, 2).toUpperCase() : "?");
          var stClass = t.status === "aberto" ? "st--aberto" : t.status === "respondido" ? "st--respondido" : "st--resolvido";
          var stLabel = t.status === "aberto" ? "Aberto" : t.status === "respondido" ? "Respondido" : "Resolvido";
          var ultima = t.mensagens && t.mensagens.length ? t.mensagens[t.mensagens.length - 1] : null;
          var naoLidas = (t.mensagens || []).filter(function (m) { return m.autor !== "cliente" && !m.lida; }).length;
          var selecionado = estado.ticketId == t.id ? "is-selected" : "";
          return '' +
          '<a class="ticket-row ' + selecionado + '" href="#" data-ticket-id="' + esc(t.id) + '">' +
          '<span class="ticket-row__avatar">' + inicial + '</span>' +
          '<div class="ticket-row__body">' +
          '<div class="ticket-row__title">#' + esc(t.id) + " · " + esc(t.assunto) + '</div>' +
          '<div class="ticket-row__meta">' + esc(t.cliente && t.cliente.nome ? t.cliente.nome : "—") + " · " + D.haQuanto(t.atualizado || t.criado) + (ultima ? " · " + (ultima.autor === "cliente" ? "Você: " : "Suporte: ") + esc(ultima.texto).slice(0, 60) : "") + '</div>' +
          '</div>' +
          '<div class="ticket-row__actions">' +
          '<span class="st ' + stClass + '">' + stLabel + '</span>' +
          (naoLidas ? '<span class="new-badge">' + naoLidas + ' nova' + (naoLidas > 1 ? "s" : "") + '</span>' : "") +
          '</div>' +
          '</a>';
        }).join("");
      }

      /* ---------- Conversa ---------- */
      function abrirConv(id) {
        estado.ticketId = id;
        var t = D.buscarTicket ? D.buscarTicket(id) : D.tickets().filter(function (x) { return x.id == id; })[0];
        if (!t) { P.toast("Ticket não encontrado", ""); return; }
        inboxEl.style.display = "none";
        convEl.classList.add("is-open");
        convNome.textContent = "#" + t.id + " · " + esc(t.assunto);
        convMeta.textContent = esc(t.cliente && t.cliente.nome ? t.cliente.nome : "—") + " · " + (t.cliente && t.cliente.email ? t.cliente.email : "") + " · motivo: " + esc(t.motivoRotulo || t.motivo);
        convStatus.value = t.status;
        carregarMensagens(id);
        iniciarPolling();
        window.history.pushState(null, "", "?ticket=" + id);
      }

      function fecharConv() {
        estado.ticketId = null;
        pararPolling();
        inboxEl.style.display = "";
        convEl.classList.remove("is-open");
        window.history.pushState(null, "", window.location.pathname);
        renderLista();
      }

      function carregarMensagens(id) {
        var t = D.buscarTicket ? D.buscarTicket(id) : D.tickets().filter(function (x) { return x.id == id; })[0];
        if (!t) return;
        convNome.textContent = "#" + t.id + " · " + esc(t.assunto);
        convMeta.textContent = esc(t.cliente && t.cliente.nome ? t.cliente.nome : "—") + " · " + (t.cliente && t.cliente.email ? t.cliente.email : "") + " · motivo: " + esc(t.motivoRotulo || t.motivo);
        convStatus.value = t.status;

        var html = '<div class="msg msg--system">Ticket <b>#' + t.id + "</b> criado em " + D.hora(t.criado) + " · motivo: <b>" + esc(t.motivoRotulo || t.motivo) + "</b></div>";
        (t.mensagens || []).forEach(function (m) {
          var ehAdminMsg = m.autor === "admin" || m.autor === "suporte";
          var cls = m.autor === "cliente" ? "msg--out" : "msg--in";
          var quem = m.autor === "cliente" ? "Você" : (ehAdminMsg ? "Suporte" : "Usuário");
          html += '<div class="msg ' + cls + '">' + esc(m.texto) + '<span class="msg__meta">' + quem + " · " + D.hora(m.em) + "</span></div>";
        });
        convMsg.innerHTML = html;
        // Rolar para o final
        setTimeout(function () { convMsg.scrollTop = convMsg.scrollHeight; }, 50);
      }

      // SSE para tempo real (se disponível)
      try {
        if (typeof EventSource !== "undefined") {
          var sse = new EventSource("/api/tickets/stream");
          sse.onmessage = function (e) {
            try { var data = JSON.parse(e.data); if (data && data.ticketId && estado.ticketId == data.ticketId) carregarMensagens(data.ticketId); renderLista(); } catch (err) {}
          };
          sse.onerror = function () { sse.close(); }; // fallback para polling
        }
      } catch (e) {}

    })();

    function esc(str) { return String(str || "").replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  </script>
</body>
</html>
